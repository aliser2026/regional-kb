<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>辽陕区域知识库 · 检索中心</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e3e6ea; --ink:#1f2329; --sub:#6b7280;
    --brand:#2f6fed; --brand-soft:#eaf1ff; --tag:#eef2f7; --shadow:0 1px 3px rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
       background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
  header{background:linear-gradient(120deg,#2f6fed,#5b8def);color:#fff;padding:22px 24px}
  header h1{margin:0;font-size:20px;font-weight:700}
  header .sub{margin:6px 0 0;font-size:13px;opacity:.92}
  .wrap{max-width:900px;margin:0 auto;padding:18px 16px 60px}
  .bar{display:flex;align-items:center;gap:10px;margin:18px 0 10px}
  .bar input{flex:1;padding:13px 16px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--card);outline:none}
  .bar input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .bar .cnt{font-size:12px;color:var(--sub);white-space:nowrap}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 14px}
  .chips button{border:1px solid var(--line);background:var(--card);color:var(--sub);
    padding:6px 14px;border-radius:999px;cursor:pointer;font-size:13px}
  .chips button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .answer{background:var(--brand-soft);border:1px solid #cfe0ff;border-radius:10px;
    padding:14px 16px;margin-bottom:16px;white-space:pre-wrap;font-size:14px;color:#173a73}
  .answer.hidden{display:none}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;
    box-shadow:var(--shadow);cursor:pointer;transition:border-color .15s}
  .card:hover{border-color:var(--brand)}
  .card .top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .badge{font-size:12px;padding:2px 9px;border-radius:6px;background:var(--brand-soft);color:#1d4ed8;font-weight:600}
  .badge.b2{background:#eafaf0;color:#1a7f4b}
  .badge.b3{background:#fff4e6;color:#b45309}
  .badge.b4{background:#f3e8ff;color:#7c3aed}
  .badge.b5{background:#ecfeff;color:#0e7490}
  .card h3{margin:0;font-size:16px;font-weight:600}
  .card .sum{color:var(--sub);font-size:13px;margin:6px 0 0}
  .tags{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .tags span{font-size:12px;background:var(--tag);color:#475569;padding:2px 8px;border-radius:6px}
  .empty{text-align:center;color:var(--sub);padding:40px 0}
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;
    padding:40px 16px;overflow:auto;z-index:50}
  .mask.show{display:flex}
  .modal{background:#fff;border-radius:14px;max-width:760px;width:100%;padding:24px 26px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .modal h2{margin:0 0 4px;font-size:20px}
  .modal .meta{color:var(--sub);font-size:13px;margin-bottom:14px}
  .modal .body{font-size:14px}
  .modal .body h1,.modal .body h2,.modal .body h3{margin:18px 0 8px}
  .modal .body table{border-collapse:collapse;width:100%;margin:10px 0;font-size:13px}
  .modal .body th,.modal .body td{border:1px solid var(--line);padding:6px 8px;text-align:left}
  .modal .body code{background:#f1f3f5;padding:1px 5px;border-radius:4px}
  .modal .body pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;overflow:auto}
  .modal .files{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
  .modal .files a{display:inline-block;margin:0 8px 8px 0;padding:6px 12px;background:var(--brand-soft);
    color:#1d4ed8;border-radius:8px;text-decoration:none;font-size:13px}
  .modal .close{float:right;border:none;background:none;font-size:22px;cursor:pointer;color:var(--sub);line-height:1}
  footer{max-width:900px;margin:24px auto 0;padding:0 16px;color:var(--sub);font-size:12px;text-align:center}
  footer code{background:#eef2f7;padding:1px 5px;border-radius:4px}
  /* —— 口令解锁层 —— */
  #lock{position:fixed;inset:0;background:linear-gradient(160deg,#eef2f8,#e3ebf7);z-index:100;
    display:flex;align-items:center;justify-content:center;padding:20px}
  #lock.hidden{display:none}
  .lock-card{background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(15,23,42,.15);
    padding:36px 32px;max-width:380px;width:100%;text-align:center}
  .lock-card .ico{font-size:40px;margin-bottom:8px}
  .lock-card h2{margin:0 0 6px;font-size:20px;color:#1f2329}
  .lock-card p{margin:0 0 18px;font-size:13px;color:var(--sub)}
  .lock-card input{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;
    font-size:15px;outline:none;text-align:center;letter-spacing:1px}
  .lock-card input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
  .lock-card button{width:100%;margin-top:12px;padding:12px;border:none;border-radius:10px;
    background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer}
  .lock-card button:hover{background:#265fd0}
  .lock-card .err{margin-top:10px;font-size:13px;color:#dc2626;min-height:18px}
  .lock-card.loading{color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div id="lock">
  <div class="lock-card">
    <div class="ico">🔐</div>
    <h2>辽陕区域知识库</h2>
    <p>内部资料 · 一人一码，请输入你的专属口令</p>
    <input id="pwd" type="password" placeholder="访问口令" autocomplete="off" />
    <button id="unlockBtn">解 锁</button>
    <div class="err" id="lockErr"></div>
  </div>
</div>

<header>
  <h1>辽陕区域知识库 · 检索中心</h1>
  <p class="sub">政策发文 · 活动SOP · 问题对策 · AI技能 · 案例分享。新人遇卡点，直接把问题打出来搜。（纯静态站，可部署到 GitHub Pages）</p>
</header>

<div class="wrap">
  <div class="bar">
    <input id="q" placeholder="例如：学校不配合打卡怎么办？整本书阅读启动会怎么开？平台海选卡顿怎么处理？" />
    <span class="cnt" id="cnt"></span>
  </div>
  <div class="chips" id="chips">
    <button data-cat="" class="active">全部</button>
    <button data-cat="区域发文">区域发文</button>
    <button data-cat="活动SOP">活动SOP</button>
    <button data-cat="问题对策">问题对策</button>
    <button data-cat="AI技能">AI技能</button>
    <button data-cat="案例分享">案例分享</button>
  </div>

  <div class="answer hidden" id="answer"></div>
  <div id="list"></div>
</div>

<div class="mask" id="mask">
  <div class="modal">
    <button class="close" id="closeBtn">×</button>
    <h2 id="mTitle"></h2>
    <div class="meta" id="mMeta"></div>
    <div class="body" id="mBody"></div>
    <div class="files" id="mFiles"></div>
  </div>
</div>

<footer>
  辽陕团队内部知识库 · 内容加密存储，<b>一人一码</b>访问，页面已绑定访问者身份与追溯水印。增删人员/换码：<code>node manage_users.js add|remove|reset|list</code>。
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
<script>
const $ = s => document.querySelector(s);
let DATA = {categories:[], entries:[]};
let curCat = "";
let timer = null;

function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[m]));}
function badgeClass(cat){
  if(cat==="区域发文") return "";
  if(cat==="活动SOP") return "b2";
  if(cat==="AI技能") return "b4";
  if(cat==="案例分享") return "b5";
  return "b3";
}

// —— 本地检索（复刻 app.py 的 tokenize / score / search / answer）——
function tokenize(q){
  q = q.toLowerCase();
  const toks = [];
  const en = q.match(/[a-z0-9]+/g);
  if(en) toks.push(...en);
  const cn = q.replace(/[a-z0-9\s]/g, '');
  for(let i=0;i<cn.length;i++){
    toks.push(cn[i]);
    if(i < cn.length-1) toks.push(cn.slice(i, i+2));
  }
  return toks;
}
function countOcc(str, t){ return str.split(t).length - 1; }
function scoreEntry(e, tokens){
  const text = (e.text||"").toLowerCase();
  const title = (e.title||"").toLowerCase();
  const tags = (e.tags||[]).join(" ").toLowerCase();
  let s = 0;
  for(const t of tokens){
    if(!t) continue;
    s += countOcc(text, t);
    if(title.includes(t)) s += 5;
    if(tags.includes(t)) s += 3;
  }
  return s;
}
function search(q, cat, limit){
  const tokens = tokenize(q);
  if(!tokens.length) return [];
  const res = [];
  for(const e of DATA.entries){
    if(cat && e.category !== cat) continue;
    const s = scoreEntry(e, tokens);
    if(s > 0) res.push([s, e]);
  }
  res.sort((a,b)=> b[0]-a[0]);
  return res.slice(0, limit||20).map(x=>x[1]);
}
function answer(q, cat){
  const results = search(q, cat, 5);
  if(!results.length){
    return "知识库里暂时没有和这个问题直接相关的条目。\n建议：① 换关键词再问一次；② 把这个问题 + 你们团队摸索出的解决经验告诉我（知行），我帮你沉淀成一条目，下次新人就能直接查到。";
  }
  const lines = [`知识库中与「${q}」相关的条目如下（共 ${results.length} 条），建议优先看靠前几条：`];
  results.forEach((e,i)=>{
    const tagstr = (e.tags&&e.tags.length)?e.tags.join("、"):"—";
    lines.push(`${i+1}. 【${e.category}】${e.title}（标签：${tagstr}）`);
  });
  lines.push("\n点开任一卡片可看完整对策 / SOP / 政策要点。");
  return lines.join("\n");
}

function renderList(entries){
  const list = $("#list");
  if(!entries.length){
    list.innerHTML = `<div class="empty">没有匹配的条目。换个关键词，或把这个问题 + 解决经验交给知行沉淀成一条目。</div>`;
    return;
  }
  list.innerHTML = entries.map(e=>{
    const tags = (e.tags||[]).map(t=>`<span>${esc(t)}</span>`).join("");
    return `<div class="card" data-id="${encodeURIComponent(e.id)}">
      <div class="top"><span class="badge ${badgeClass(e.category)}">${esc(e.category)}</span>
      <h3>${esc(e.title)}</h3></div>
      ${e.summary?`<div class="sum">${esc(e.summary)}</div>`:""}
      ${tags?`<div class="tags">${tags}</div>`:""}
    </div>`;
  }).join("");
  list.querySelectorAll(".card").forEach(c=>{
    c.addEventListener("click", ()=>openEntry(decodeURIComponent(c.dataset.id)));
  });
}

async function refresh(){
  const q = $("#q").value.trim();
  let entries;
  if(q){
    entries = search(q, curCat, 20);
    const ansBox = $("#answer");
    ansBox.textContent = answer(q, curCat);
    ansBox.classList.remove("hidden");
  }else{
    entries = DATA.entries.filter(e=> !curCat || e.category===curCat);
    $("#answer").classList.add("hidden");
  }
  renderList(entries);
  $("#cnt").textContent = entries.length + " 条";
}

function onInput(){
  clearTimeout(timer);
  timer = setTimeout(refresh, 200);
}

function openEntry(id){
  const e = DATA.entries.find(x=>x.id===id);
  if(!e) return;
  $("#mTitle").textContent = e.title||"";
  $("#mMeta").textContent = (e.category||"") + (e.tags&&e.tags.length?(" · 标签："+e.tags.join("、")):"");
  $("#mBody").innerHTML = e.html||"";
  const filesBox = $("#mFiles");
  if(e.files && e.files.length){
    filesBox.innerHTML = "<strong>附件：</strong><br>" + e.files.map(f=>{
      if(f.approved && !f.missing) return `<a href="./files/${esc(f.name)}" target="_blank">${esc(f.name)}</a>`;
      if(f.missing) return `<span style="color:#b45309">${esc(f.name)}（缺失）</span>`;
      return `<span style="color:#6b7280">${esc(f.name)}（未开放下载）</span>`;
    }).join("");
  }else{
    filesBox.innerHTML = "";
  }
  $("#mask").classList.add("show");
}
function closeModal(){$("#mask").classList.remove("show");}

$("#q").addEventListener("input", onInput);
$("#chips").addEventListener("click", e=>{
  if(e.target.tagName!=="BUTTON") return;
  document.querySelectorAll("#chips button").forEach(b=>b.classList.remove("active"));
  e.target.classList.add("active");
  curCat = e.target.dataset.cat;
  refresh();
});
$("#closeBtn").addEventListener("click", closeModal);
$("#mask").addEventListener("click", e=>{if(e.target.id==="mask") closeModal();});
document.addEventListener("keydown", e=>{if(e.key==="Escape") closeModal();});

// —— 一人一码解锁 + 身份识别 + 追溯水印 ——
const LOCK_KEY = "kb_pass_cache";
let encText = null;      // data.enc 原文（主密钥加密）
let usersDb = null;      // users.json（每人一条包裹密钥）
let unlocked = false;
let currentUser = null;

async function loadEnc(){
  if(encText && usersDb) return encText;
  // no-store：强制绕过浏览器缓存，保证「剔除某人/换码」后立即生效
  const [r1, r2] = await Promise.all([
    fetch("./data.enc",   { cache: "no-store" }),
    fetch("./users.json", { cache: "no-store" })
  ]);
  if(!r1.ok) throw new Error("data.enc 加载失败(" + r1.status + ")");
  if(!r2.ok) throw new Error("users.json 加载失败(" + r2.status + ")");
  encText = await r1.text();
  usersDb = await r2.json();
  return encText;
}

// 用「个人专属口令」解开被包裹的主密钥，同时识别出访问者是谁
function resolveUser(pass){
  for(const u of (usersDb && usersDb.users ? usersDb.users : [])){
    try{
      const out = CryptoJS.AES.decrypt(u.wrapped, pass).toString(CryptoJS.enc.Utf8);
      if(out && out.indexOf("MK1:") === 0) return { mk: out.slice(4), user: u };
    }catch(e){ /* 不是这个人，继续试下一个 */ }
  }
  return null;
}

function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

// 整页覆盖「姓名+小组+时间」水印，截图/拍照可追溯到人
function showWatermark(u){
  const stamp = new Date().toLocaleString("zh-CN", { hour12:false });
  const label = esc((u.name || "") + (u.tag ? "·" + u.tag : "") + " " + stamp);
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='320' height='170'>"
    + "<text x='12' y='92' transform='rotate(-22 160 85)' fill='%230f172a' "
    + "font-size='15' font-family='sans-serif' opacity='0.28'>" + label + "</text></svg>";
  let wm = document.getElementById("wm");
  if(!wm){ wm = document.createElement("div"); wm.id = "wm"; document.body.appendChild(wm); }
  wm.style.cssText = "position:fixed;inset:0;z-index:9998;pointer-events:none;"
    + "background-repeat:repeat;background-image:url(\"data:image/svg+xml;utf8," + svg + "\");";

  let bar = document.getElementById("whoBar");
  if(!bar){ bar = document.createElement("div"); bar.id = "whoBar"; document.body.appendChild(bar); }
  bar.innerHTML = "当前访问者：<b>" + esc(u.name) + "</b>"
    + (u.tag ? "（" + esc(u.tag) + "）" : "") + " · " + esc(stamp)
    + " · 内容已绑定你的身份，请勿外传";
  bar.style.cssText = "position:fixed;right:12px;bottom:12px;z-index:9999;"
    + "background:rgba(15,23,42,.82);color:#fff;font-size:12px;padding:6px 12px;"
    + "border-radius:20px;pointer-events:none;";
}

function tryUnlock(pass){
  const r = resolveUser(pass);
  if(!r) return false;                       // 名单里没有这个人（已被剔除/口令错）
  const bytes = CryptoJS.AES.decrypt(encText, r.mk);
  const json = bytes.toString(CryptoJS.enc.Utf8);
  if(!json || json.indexOf("{") !== 0) return false;
  DATA = JSON.parse(json);
  currentUser = r.user;
  unlocked = true;
  sessionStorage.setItem(LOCK_KEY, pass);
  $("#lock").classList.add("hidden");
  showWatermark(r.user);
  refresh();
  return true;
}

async function boot(){
  const errBox = $("#lockErr");
  try{
    await loadEnc();
  }catch(err){
    $("#lock").querySelector(".lock-card").classList.add("loading");
    errBox.textContent = "数据加载失败，请刷新重试";
    return;
  }
  // 同一会话已解锁过，直接用缓存口令
  const cached = sessionStorage.getItem(LOCK_KEY);
  if(cached && tryUnlock(cached)) return;
  // 等待用户输入口令
  const doUnlock = ()=>{
    const pass = $("#pwd").value;
    if(!pass) return;
    try{
      if(tryUnlock(pass)){
        errBox.textContent = "";
      }else{
        errBox.textContent = "口令无效，或你已不在访问名单中";
        $("#pwd").select();
      }
    }catch(e){
      errBox.textContent = "口令无效，或你已不在访问名单中";
      $("#pwd").select();
    }
  };
  $("#unlockBtn").addEventListener("click", doUnlock);
  $("#pwd").addEventListener("keydown", e=>{ if(e.key==="Enter") doUnlock(); });
  $("#pwd").focus();
}
boot();

</script>
</body>
</html>
